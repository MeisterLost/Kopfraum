/* ============ Zusammenführen (Konflikte pro Eintrag, neuester gewinnt) ============ */
function mergeArr(a,b){
  const m = new Map();
  [...(a||[]),...(b||[])].forEach(x=>{ if(!x||!x.id) return; const o=m.get(x.id); if(!o || (x.updated||0) > (o.updated||0)) m.set(x.id,x); });
  const cutoff = now() - 120*864e5;
  return [...m.values()].filter(x=>!(x.deleted && (x.updated||0)<cutoff));
}
function merge(l,r){ return { v:1, cats:mergeArr(l.cats,r.cats), tasks:mergeArr(l.tasks,r.tasks) }; }

/* ============ Google-Drive-Sync ============ */
const GIS_URL = "https://accounts.google.com/gsi/client";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE = "https://www.googleapis.com/drive/v3/files";
const UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";
const httpsOk = () => location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
const canon = d => JSON.stringify({c:[...(d.cats||[])].sort((a,b)=>a.id<b.id?-1:1), t:[...(d.tasks||[])].sort((a,b)=>a.id<b.id?-1:1)});
const Sync = {
  client:null, state:"off", err:"", busy:false, again:false, timer:null, pendingAfterAuth:false,
  get connected(){ return !!(CFG.clientId && CFG.gConnected); },
  tokenValid(){ return CFG.gToken && CFG.gExp > now() + 60000; },
  label(){
    if (!CFG.clientId || !CFG.gConnected) return {cls:"", text:"Nur auf diesem Gerät"};
    if (this.state==="auth") return {cls:"err", text:"Google: tippen zum Fortsetzen", act:"reauth"};
    if (this.state==="busy") return {cls:"busy", text:"Synchronisiere …"};
    if (this.state==="err") return {cls:"err", text:"Fehler: "+this.err};
    const t = CFG.lastSync ? new Date(CFG.lastSync) : null;
    return {cls:"ok", text: t ? `Drive ✓ ${pad(t.getHours())}:${pad(t.getMinutes())}` : "Google Drive verbunden"};
  },
  set(state, err=""){ this.state=state; this.err=err; renderSide(); },
  loadLib(){
    if (window.google?.accounts?.oauth2) return Promise.resolve();
    return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=GIS_URL; s.async=true; s.onload=res; s.onerror=()=>rej(new Error("Google-Anmeldung nicht ladbar")); document.head.appendChild(s); });
  },
  async init(){
    if (!CFG.clientId || !httpsOk()) { renderSide(); return; }
    try {
      await this.loadLib();
      this.client = google.accounts.oauth2.initTokenClient({
        client_id: CFG.clientId, scope: SCOPE,
        callback: r => this.onToken(r),
        error_callback: e => { this.set(CFG.gConnected?"auth":"off"); if (e?.type!=="popup_closed") toast("Google-Anmeldung: "+(e?.message||e?.type||"abgebrochen")); }
      });
      if (CFG.gConnected){ if (this.tokenValid()) this.sync(); else this.set("auth"); }
      else renderSide();
    } catch(e){ console.error(e); this.set("err", short(e)); }
  },
  async onToken(r){
    if (r.error){ this.set("err", r.error); toast("Google: "+r.error); return; }
    CFG.gToken = r.access_token; CFG.gExp = now() + (r.expires_in||3600)*1000;
    const first = !CFG.gConnected; CFG.gConnected = true; lsSet(LS_CFG, CFG);
    if (first){
      try { const a = await (await fetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)",{headers:{Authorization:"Bearer "+CFG.gToken}})).json(); CFG.gEmail = a?.user?.emailAddress||""; lsSet(LS_CFG,CFG); } catch(e){}
      toast("Mit Google Drive verbunden ✓");
      if ($("ovbg").classList.contains("on") && $("s-cid")) settings();
    }
    this.state="ok"; this.sync(true);
  },
  async login(){
    if (!CFG.clientId){ toast("Bitte zuerst die Client-ID eintragen"); return; }
    if (!httpsOk()){ toast("Funktioniert erst über deine GitHub-Adresse (https)"); return; }
    if (!this.client) await this.init();
    if (!this.client) return;
    this.client.requestAccessToken({ prompt: CFG.gConnected ? "" : "consent", login_hint: CFG.gEmail || undefined });
  },
  reauth(){ this.login(); },
  logout(){
    try { if (CFG.gToken && window.google) google.accounts.oauth2.revoke(CFG.gToken, ()=>{}); } catch(e){}
    Object.assign(CFG,{gToken:"",gExp:0,gConnected:false,gEmail:"",gFile:"",gFolder:"",lastSync:0}); lsSet(LS_CFG,CFG);
    this.state="off"; renderSide(); toast("Von Google getrennt. Deine Daten bleiben auf diesem Gerät.");
  },
  async api(url, opt={}){
    const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:"Bearer "+CFG.gToken}});
    if (r.status===401){ CFG.gToken=""; CFG.gExp=0; lsSet(LS_CFG,CFG); const e=new Error("auth"); e.auth=true; throw e; }
    return r;
  },
  async findFile(){
    const q = encodeURIComponent(`name='${FILE}' and trashed=false`);
    const r = await this.api(`${DRIVE}?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,parents)`);
    if (!r.ok) throw new Error("Suche "+r.status);
    const f = (await r.json()).files?.[0];
    CFG.gFile = f?.id || ""; if (f?.parents?.[0]) CFG.gFolder = f.parents[0];
    lsSet(LS_CFG,CFG); return CFG.gFile;
  },
  async pull(){
    if (!CFG.gFile && !(await this.findFile())) return null;
    let r = await this.api(`${DRIVE}/${CFG.gFile}?alt=media`, {cache:"no-store"});
    if (r.status===404){ CFG.gFile=""; if(!(await this.findFile())) return null; r = await this.api(`${DRIVE}/${CFG.gFile}?alt=media`, {cache:"no-store"}); }
    if (!r.ok) throw new Error("Lesen "+r.status);
    try { return await r.json(); } catch(e){ return null; }
  },
  async ensureFolder(){
    if (CFG.gFolder) return CFG.gFolder;
    const q = encodeURIComponent("name='Kopfraum' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    let r = await this.api(`${DRIVE}?q=${q}&fields=files(id)`);
    const f = r.ok ? (await r.json()).files?.[0] : null;
    if (f){ CFG.gFolder=f.id; return f.id; }
    r = await this.api(DRIVE, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:"Kopfraum", mimeType:"application/vnd.google-apps.folder"})});
    if (!r.ok) throw new Error("Ordner "+r.status);
    CFG.gFolder = (await r.json()).id; lsSet(LS_CFG,CFG); return CFG.gFolder;
  },
  async push(){
    const data = JSON.stringify(S);
    if (CFG.gFile){
      const r = await this.api(`${UPLOAD}/${CFG.gFile}?uploadType=media`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:data});
      if (r.ok) return; if (r.status!==404) throw new Error("Speichern "+r.status); CFG.gFile="";
    }
    const folder = await this.ensureFolder();
    const b = "kopfraum" + uid();
    const meta = {name:FILE, mimeType:"application/json", parents:[folder]};
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
    const r = await this.api(`${UPLOAD}?uploadType=multipart&fields=id`, {method:"POST", headers:{"Content-Type":"multipart/related; boundary="+b}, body});
    if (!r.ok) throw new Error("Anlegen "+r.status);
    CFG.gFile = (await r.json()).id; lsSet(LS_CFG,CFG);
  },
  schedule(){ if(!this.connected) return; clearTimeout(this.timer); this.timer = setTimeout(()=>this.sync(), 1500); },
  async sync(manual){
    if (!this.connected){ if(manual) toast("Erst in den Einstellungen mit Google verbinden"); return; }
    if (!this.tokenValid()){ this.set("auth"); if (manual) this.reauth(); return; }
    if (this.busy){ this.again=true; return; }
    this.busy=true; this.set("busy");
    try {
      const remote = await this.pull();
      if (remote && remote.tasks) S = merge(S, remote);
      save();
      if (!remote || canon(remote)!==canon(S)) await this.push();
      CFG.lastSync = now(); lsSet(LS_CFG, CFG);
      this.busy=false; this.set("ok"); renderMain();
      if (manual===true) toast("Synchronisiert ✓");
    } catch(e){
      console.error(e); this.busy=false;
      if (e.auth) this.set("auth"); else { this.set("err", short(e)); if(manual) toast("Sync-Fehler: "+short(e)); }
    }
    if (this.again){ this.again=false; this.sync(); }
  }
};
function short(e){ return String(e?.message || e).slice(0,60); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") Sync.sync(); });
setInterval(()=>{ if(document.visibilityState==="visible" && Sync.tokenValid()) Sync.sync(); }, 120000);
window.addEventListener("online", ()=>Sync.sync());

applyLook();
render();
Focus.resume();
Sync.init();
</script>
