<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopfraum">
<title>Kopfraum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b6cf0'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%235b6cf0'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --panel2:#efebe4; --line:#e3ded5; --text:#24262b; --muted:#76736c;
  --accent:#5b6cf0; --accent-soft:#e7e9fd; --danger:#d0493b; --warn:#d98a1e; --ok:#2f9e77;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1d21; --panel:#23262b; --panel2:#2c3036; --line:#353941; --text:#e9e7e2; --muted:#9a978f;
  --accent:#8592ff; --accent-soft:#2f3354; --danger:#ff7a6b; --warn:#f0a84a; --ok:#4cc79b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{display:grid;grid-template-columns:270px 1fr;height:100%}
/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:var(--sat)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font-weight:700;font-size:18px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav h4{margin:18px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.nav h4 button{color:var(--muted);font-size:18px;line-height:1;padding:0 4px;border-radius:6px}
.nav h4 button:hover{color:var(--text);background:var(--panel2)}
.ni{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--text)}
.ni:hover{background:var(--panel2)}
.ni.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ni .ic{width:20px;text-align:center;flex:none}
.ni .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ni .ct.hot{background:var(--accent);color:#fff;border-radius:20px;padding:0 7px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.car{width:16px;flex:none;color:var(--muted);font-size:11px;text-align:center;transition:transform .15s}
.car.closed{transform:rotate(-90deg)}
.car.none{visibility:hidden}
.ni .plus{opacity:0;color:var(--muted);padding:0 4px;font-size:16px}
.ni:hover .plus{opacity:1}
.sidefoot{border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--sab));display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sidefoot .st{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.sidefoot .st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sd.ok{background:var(--ok)}.sd.busy{background:var(--warn);animation:pulse 1s infinite}.sd.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{padding:6px 8px;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
/* Main */
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(18px + var(--sat)) 28px 0;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{color:var(--muted);font-size:13px;font-weight:400;display:block;margin-top:2px;white-space:normal;letter-spacing:0}
.menu{display:none}
.aibtn{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-weight:600;font-size:14px}
.aibtn:hover{border-color:var(--accent);color:var(--accent)}
#banner .note{margin:12px 28px 0;display:flex;align-items:center;gap:10px;border-left-color:var(--accent)}
#banner .note span{flex:1}
.steps .step{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px dashed var(--line)}
.steps .step .chk{width:18px;height:18px}
.steps .step span{flex:1}
.steps .step.done span{text-decoration:line-through;color:var(--muted)}
.steps .step.done .chk{background:var(--ok);border-color:var(--ok)}
.steps .step .x{color:var(--muted);font-size:18px;padding:0 6px}
.stat:disabled{cursor:default}
details.more{border-top:1px solid var(--line);padding-top:10px;margin-bottom:4px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:12px}
.fld .opt{font-weight:400;opacity:.8}
.seg{flex-wrap:wrap}
.capture{margin:14px 28px 4px;display:flex;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow);transition:border-color .15s}
.capture:focus-within{border-color:var(--accent)}
.capture input{flex:1;border:0;outline:0;background:transparent;min-width:0;padding:8px 0;font-size:16px}
.capture button{background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:600}
.hint{margin:0 30px 6px;font-size:12px;color:var(--muted)}
.hint code{background:var(--panel2);border-radius:5px;padding:0 4px;font-size:11.5px}
.content{flex:1;overflow:auto;padding:10px 28px calc(40px + var(--sab))}
/* Tasks */
.group{margin-top:18px}
.group>h3{font-size:13px;color:var(--muted);margin:0 4px 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.group>h3 .dot{width:8px;height:8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.task:first-child{border-top:0}
.task:hover{background:var(--panel2)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .15s}
.chk:hover{border-color:var(--ok)}
.chk.p3{border-color:var(--danger)}.chk.p2{border-color:var(--warn)}.chk.p1{border-color:var(--accent)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk::after{content:"✓";color:#fff;font-size:13px;font-weight:700}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task.pop .chk{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.3)}}
.tb{flex:1;min-width:0}
.tt{word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:20px;padding:1px 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.over{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.today{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chip.wait{color:var(--accent);background:var(--accent-soft)}
.chip.p3{color:var(--danger)}.chip.p2{color:var(--warn)}.chip.p1{color:var(--accent)}
.chip .dot{width:7px;height:7px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.sugg .lbl{font-size:12px;color:var(--muted)}
.sbtn{white-space:nowrap;font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;background:var(--panel)}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.best{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.movesel{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 8px;background:var(--panel);max-width:180px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;font-size:34px;margin-bottom:8px}
.showdone{margin:14px 4px;color:var(--muted);font-size:13px}
.showdone:hover{color:var(--text)}
/* Overview */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left}
.stat:hover{border-color:var(--accent)}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.over .n{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;border-top:4px solid var(--c);display:flex;flex-direction:column}
.card .hd{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.card .hd b{font-size:16px;flex:1}
.card .hd span{font-size:13px;color:var(--muted)}
.card .hd .ov{color:var(--warn);font-weight:600}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.subs button{font-size:12.5px;background:var(--panel2);border-radius:20px;padding:2px 10px}
.subs button:hover{background:var(--accent-soft);color:var(--accent)}
.subs button em{font-style:normal;color:var(--muted);margin-left:4px}
.mini{margin-top:6px}
.mini .task{padding:7px 2px;border-top:1px dashed var(--line);gap:9px}
.mini .task:first-child{border-top:0}
.mini .task:hover{background:transparent}
.mini .chk{width:18px;height:18px}
.mini .tt{font-size:14px}
.card .nothing{color:var(--muted);font-size:13px;padding:6px 0}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-size:14px}
/* Modal */
.ov-bg{position:fixed;inset:0;background:rgba(10,12,18,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov-bg.on{display:flex}
.modal{background:var(--panel);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px}
.modal h2{margin:0 0 14px;font-size:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fld textarea{min-height:80px;resize:vertical}
.fld .help{font-size:12px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.acts{display:flex;gap:8px;margin-top:18px;align-items:center}
.acts .sp{flex:1}
.btn{padding:9px 16px;border-radius:10px;font-weight:600;background:var(--panel2)}
.btn.pri{background:var(--accent);color:#fff}
.btn.dan{color:var(--danger);background:transparent;padding-left:4px}
.btn:disabled{opacity:.5;cursor:default}
.codebox{display:flex;gap:6px}
.codebox input{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.sect{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sect h3{font-size:14px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:60;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700}
.tabs{display:none}
.scrim{display:none}


.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.fbar .lbl{font-size:12.5px;color:var(--muted)}
.fstart{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.tcheck{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-size:14px}
.tc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tc-bar{height:8px;background:var(--panel2);border-radius:8px;margin-top:8px;overflow:hidden}
.tc-bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.tcheck.tight .tc-bar i{background:var(--warn)}
.tc-msg{margin-top:8px;color:var(--muted)}
.week{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd b{color:var(--text);font-size:13px;min-height:16px}
.wb{height:80px;width:100%;max-width:34px;background:var(--panel2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%;background:var(--ok);border-radius:8px}

.tgl{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.tgl input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.tgl small{color:var(--muted)}
/* Reizarm */
body.calm .app, body.calm .modal, body.calm .focus, body.calm .tabs, body.calm .toast{filter:saturate(.3)}
body.calm{--shadow:none}
body.calm *, body.calm *::before, body.calm *::after{animation:none!important;transition:none!important}
body.calm .capture{box-shadow:none}
body.calm .ov-bg{background:rgba(10,12,18,.25)}
@media (prefers-reduced-motion:reduce){ *, *::before, *::after{animation:none!important;transition:none!important} }
body.fs-s{zoom:.92} body.fs-l{zoom:1.12} body.fs-xl{zoom:1.25}
/* Fokus */
.focus{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;overflow:auto;padding:calc(20px + var(--sat)) 20px calc(30px + var(--sab))}
.focus.on{display:block}
.f-x{position:absolute;top:calc(12px + var(--sat));right:16px;font-size:28px;color:var(--muted);width:44px;height:44px;border-radius:12px}
.f-x:hover{background:var(--panel2)}
.f-wrap{max-width:560px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.f-cat{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;margin-top:10px}
.f-title{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.01em}
.f-timer{position:relative;width:min(260px,70vw);aspect-ratio:1}
.f-svg{width:100%;height:100%;transform:rotate(-90deg)}
.f-bg{fill:none;stroke:var(--panel2);stroke-width:12}
.f-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.f-fg.pz{stroke:var(--ok)}
.focus.over .f-time{color:var(--warn)}
.f-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.f-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.f-lbl{font-size:13px;color:var(--muted)}
.f-durs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.f-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn.big{padding:12px 34px;font-size:17px;border-radius:14px}
.f-msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.f-step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.f-now{font-size:19px;font-weight:600}
.f-step input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);outline:0;min-width:0}
.f-step input:focus{border-color:var(--accent)}
#f-en{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
#f-en button{border-top:1px solid var(--line);margin-top:-1px}
.f-bottom{margin-top:6px}
.f-done{padding-top:40px}
.f-done h2{margin:6px 0}
.f-done p{color:var(--muted);margin:0 0 18px}
.f-done .f-row .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Mobile */
@media (max-width:860px){
  #banner .note{margin:10px 16px 0}
  .aibtn span{display:none}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  .scrim.on{display:block}
  .menu{display:block}
  .top{padding:calc(12px + var(--sat)) 16px 0}
  .top h1{font-size:21px}
  .capture{margin:12px 16px 4px}
  .hint{margin:0 18px 4px}
  .content{padding:6px 16px calc(90px + var(--sab))}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab));z-index:30}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
  .tabs button b{font-size:19px;font-weight:400;line-height:1.2}
  .tabs button.on{color:var(--accent);font-weight:600}
  .tabs .bd{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:700}
  .ni .plus{opacity:1}
  .modal{border-radius:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim" data-act="closemenu"></div>
  <main class="main">
    <div class="top">
      <button class="iconbtn menu" data-act="menu" aria-label="Menü">☰</button>
      <h1 id="title"></h1>
      <button class="aibtn" data-act="focus" title="Fokus-Modus: eine Aufgabe, ein Timer">🎯 <span>Fokus</span></button>
      <button class="aibtn" data-act="ai" title="Mit Claude sortieren, zerlegen, entscheiden">🤖 <span>Claude</span></button>
    </div>
    <div id="banner"></div>
    <form class="capture" id="capture" autocomplete="off">
      <input id="qa" placeholder="Was geht dir durch den Kopf? Einfach reinwerfen …" enterkeyhint="done">
      <button type="submit">＋</button>
    </form>
    <div class="hint" id="hint">Tipp: <code>#trading</code> Kategorie · <code>!</code>–<code>!!!</code> Priorität · <code>@morgen</code> <code>@fr</code> <code>@24.12</code> fällig · <code>~30</code> Minuten · <code>@irgendwann</code></div>
    <div class="content" id="content"></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="ov-bg" id="ovbg"><div class="modal" id="modal"></div></div>
<div class="focus" id="focus"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Speicher & Datenmodell ============ */
const LS_DATA = "kopfraum_data_v1", LS_CFG = "kopfraum_cfg_v2", FILE = "kopfraum.json";
const COLORS = ["#5b6cf0","#2f9e77","#c2703d","#d0493b","#a855c7","#0e8fb3","#c99a12","#6b7280","#e0648f","#4b8f2c"];
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayOff = n => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return dstr(d); };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");

function seed(){
  // feste IDs + alter Zeitstempel: so entstehen keine Duplikate, wenn mehrere Geräte frisch starten
  const t = 1;
  const c = (id,name,color,kw,order,parentId=null) => ({id,name,color,keywords:kw,parentId,order,collapsed:false,learn:{},updated:t});
  const tk = (id,title,catId=null,extra={}) => ({id,title,notes:"",catId,due:null,prio:0,done:false,created:t,updated:t,...extra});
  return { v:1, cats:[
    c("c-arbeit","Arbeit","#5b6cf0","meeting, kunde, chef, bericht, mail, projekt, präsentation",1),
    c("c-tv","TradingView","#2f9e77","chart, alarm, indikator, pine, trade, aktie, krypto, btc, watchlist",2),
    c("c-privat","Privat","#c2703d","einkaufen, arzt, putzen, wäsche, geburtstag, rechnung, termin",3),
    c("c-tv-alarme","Alarme","#2f9e77","alarm, alert",1,"c-tv"),
  ], tasks:[
    tk("t-welcome","Willkommen! Oben einfach alles reinwerfen und Enter drücken"),
    tk("t-ex1","BTC Alarm bei 100k einrichten"),
    tk("t-ex2","Geburtstagsgeschenk für Mama überlegen"),
    tk("t-ex3","Pine-Script für eigenen Indikator anschauen","c-tv"),
  ]};
}
let S = lsGet(LS_DATA) || seed();
let CFG = Object.assign({clientId:"", lastSync:0, gConnected:false, gToken:"", gExp:0, gEmail:"", gFile:"", gFolder:"", calm:false, fontSize:"m", dayEnd:"22:00", energy:"", sound:false}, lsGet(LS_CFG) || {});
let UI = { view: (location.hash||"").slice(1) || "overview", showDone:false, menu:false };
if (!/^(inbox|today|overview|all|done|later|waiting|review|cat-[a-z0-9]+)$/.test(UI.view)) UI.view = "overview";

const cats = () => S.cats.filter(c => !c.deleted).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));
const tasks = () => S.tasks.filter(t => !t.deleted);
const catById = id => S.cats.find(c => c.id===id && !c.deleted);
const kids = id => cats().filter(c => c.parentId===id);
const descIds = id => { const out=[id]; kids(id).forEach(k => out.push(...descIds(k.id))); return out; };
const catPath = id => { const p=[]; let c=catById(id); while(c){ p.unshift(c.name); c=catById(c.parentId); } return p.join(" › "); };
const rootOf = id => { let c=catById(id); while(c && catById(c.parentId)) c=catById(c.parentId); return c; };
/* Status: offen & handlungsfähig = live; zurückgestellt (snooze/irgendwann) und „wartet auf“ zählen nicht mit */
const isParked = t => !!t.someday || !!(t.snooze && t.snooze > dayOff(0));
const live = t => !t.done && !t.waiting && !isParked(t);
const ENERGY = { leicht:{ic:"🪶",n:"leicht"}, fokus:{ic:"🧠",n:"Konzentration"}, sozial:{ic:"💬",n:"sozial"}, reize:{ic:"🔊",n:"reizintensiv"} };
const EFILTER = { "":"Alle", leicht:"🪶 Nur leichte", ruhig:"🤫 Ohne Soziales & Reize" };
const energyOk = t => !CFG.energy || t.done || (CFG.energy==="leicht" ? t.energy==="leicht" : CFG.energy==="ruhig" ? !["sozial","reize"].includes(t.energy) : true);
const openIn = id => { const ids=new Set(descIds(id)); return tasks().filter(t=>live(t) && ids.has(t.catId)); };
const inbox = () => tasks().filter(t => live(t) && !catById(t.catId));
const isOver = t => t.due && t.due < dayOff(0);
const todayList = () => tasks().filter(t => live(t) && ((t.due && t.due <= dayOff(0)) || (t.prio===3 && !t.due)));
const parkedList = () => tasks().filter(t => !t.done && !t.waiting && isParked(t));
const waitingList = () => tasks().filter(t => !t.done && t.waiting);
const fmtMin = m => m>=60 ? `${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}` : `${m} min`;
const fmtDate = s => { const d=new Date(s+"T12:00"); return `${["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`; };
const daysSince = ts => Math.floor((now()-ts)/864e5);
const touch = o => { o.updated = now(); return o; };

function sortTasks(list){
  const T = dayOff(0);
  return list.slice().sort((a,b)=>{
    if (a.done!==b.done) return a.done?1:-1;
    if (a.done) return (b.doneAt||0)-(a.doneAt||0);
    const ad=a.due||"9999", bd=b.due||"9999";
    const au=ad<=T, bu=bd<=T;
    if (au!==bu) return au?-1:1;
    if ((b.prio||0)!==(a.prio||0)) return (b.prio||0)-(a.prio||0);
    if (ad!==bd) return ad<bd?-1:1;
    return (a.created||0)-(b.created||0);
  });
}

function save(){ lsSet(LS_DATA, S); }
function commit(){ save(); render(); Sync.schedule(); }

/* ============ Schnelleingabe-Parser ============ */
const WD = {so:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6};
function parseQuick(raw){
  let title = raw, catId=null, prio=0, due=null, someday=false, est=null;
  title = title.replace(/(^|\s)~(\d+(?:[.,]\d+)?)\s?(h|std|m|min)?(?=\s|$)/gi, (m,sp,n,u)=>{ const v=parseFloat(n.replace(",",".")); est = Math.round(u && /^(h|std)$/i.test(u) ? v*60 : v); return " "; });
  title = title.replace(/(^|\s)(!{1,3}|![123])(?=\s|$)/g, (m,sp,p)=>{ prio = /\d/.test(p) ? +p[1] : p.length; return " "; });
  title = title.replace(/(^|\s)@(\S+)/g, (m,sp,w)=>{
    const x = w.toLowerCase();
    if (x==="irgendwann"||x==="später"||x==="spaeter"){ someday=true; return " "; }
    if (x==="heute") due=dayOff(0);
    else if (x==="morgen") due=dayOff(1);
    else if (x==="übermorgen"||x==="uebermorgen") due=dayOff(2);
    else if (x==="woche"||x==="nächstewoche") due=dayOff(7);
    else if (WD[x.slice(0,2)]!==undefined && /^[a-zä]+$/.test(x)){ const d=new Date(); let diff=(WD[x.slice(0,2)]-d.getDay()+7)%7; if(diff===0) diff=7; due=dayOff(diff); }
    else { const m2 = x.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/); if(m2){ let y=m2[3]?+m2[3]:new Date().getFullYear(); if(y<100) y+=2000; const d=new Date(y,+m2[2]-1,+m2[1],12); if(!m2[3] && dstr(d)<dayOff(0)) d.setFullYear(y+1); due=dstr(d);} else return m; }
    return " ";
  });
  title = title.replace(/(^|\s)#(\S+)/g, (m,sp,w)=>{
    const q = norm(w); if(!q) return m;
    const all = cats();
    const hit = all.find(c=>norm(c.name)===q) || all.find(c=>norm(c.name).startsWith(q)) || all.find(c=>norm(c.name).includes(q));
    if (hit){ catId=hit.id; return " "; }
    return m;
  });
  return { title: title.replace(/\s+/g," ").trim(), catId, prio, due, someday, est };
}

/* ============ Sortier-Vorschläge (lernt mit) ============ */
const STOP = new Set("und oder aber für mit von der die das den dem des ein eine einen einem einer ist sind war noch mal auch nicht mehr sehr bitte muss müssen machen erledigen schauen anschauen heute morgen woche über unter beim zum zur nach vor".split(" "));
const words = s => (s.toLowerCase().match(/[a-zäöüß0-9]{4,}/g)||[]).filter(w=>!STOP.has(w));
function suggest(t){
  const tw = new Set(words(t.title)), tl = t.title.toLowerCase(), n = norm(t.title);
  const scored = cats().map(c=>{
    let s = 0;
    if (norm(c.name).length>2 && n.includes(norm(c.name))) s += 5;
    (c.keywords||"").split(",").map(k=>k.trim().toLowerCase()).filter(Boolean).forEach(k=>{ if (tl.includes(k)) s += 3; });
    Object.entries(c.learn||{}).forEach(([w,cnt])=>{ if (tw.has(w)) s += Math.min(cnt,4); });
    if (c.parentId) s += .1;
    return {c,s};
  }).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s);
  return scored.slice(0,3).map(x=>x.c);
}
function learn(t, catId){
  const c = catById(catId); if(!c) return;
  c.learn = c.learn || {};
  words(t.title).forEach(w=>{ c.learn[w]=(c.learn[w]||0)+1; });
  const e = Object.entries(c.learn).sort((a,b)=>b[1]-a[1]).slice(0,80);
  c.learn = Object.fromEntries(e); touch(c);
}

/* ============ Rendering ============ */
const $ = id => document.getElementById(id);
function dueChip(t){
  if (!t.due) return "";
  const T=dayOff(0), M=dayOff(1);
  const d = new Date(t.due+"T12:00");
  const wd = ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()];
  let cls="", txt=`${wd} ${d.getDate()}.${d.getMonth()+1}.`;
  if (t.due<T && !t.done){ cls="over"; txt="war für "+txt; }
  else if (t.due===T){ cls="today"; txt="Heute"; }
  else if (t.due===M) txt="Morgen";
  return `<span class="chip ${cls}">📅 ${txt}</span>`;
}
const PRIO = ["","niedrig","mittel","hoch"];
function taskRow(t, opt={}){
  const c = catById(t.catId);
  let meta = "";
  if (opt.showCat !== false){
    if (c) meta += `<span class="chip"><span class="dot" style="background:${esc(c.color)}"></span>${esc(opt.subOnly && opt.rootId ? catPath(t.catId).split(" › ").slice(1).join(" › ") || c.name : catPath(t.catId))}</span>`;
  }
  meta += dueChip(t);
  if (t.prio) meta += `<span class="chip p${t.prio}">⚑ ${PRIO[t.prio]}</span>`;
  if (t.steps?.length) meta += `<span class="chip">☑ ${t.steps.filter(x=>x.done).length}/${t.steps.length}</span>`;
  if (t.est) meta += `<span class="chip">⏱ ${fmtMin(t.est)}</span>`;
  if (t.energy && ENERGY[t.energy]) meta += `<span class="chip">${ENERGY[t.energy].ic} ${ENERGY[t.energy].n}</span>`;
  if (t.waiting) meta += `<span class="chip wait">⏳ ${esc(t.waiting)}${t.waitSince?` · seit ${daysSince(t.waitSince)||"heute"}${daysSince(t.waitSince)===1?" Tag":daysSince(t.waitSince)>1?" Tagen":""}`:""}</span>`;
  if (!t.done && t.someday) meta += `<span class="chip">💤 irgendwann</span>`;
  else if (!t.done && t.snooze && t.snooze > dayOff(0)) meta += `<span class="chip">💤 ab ${fmtDate(t.snooze)}</span>`;
  if (t.notes) meta += `<span class="chip">📝</span>`;
  let sug = "";
  if (opt.inbox){
    const s = suggest(t);
    sug = `<div class="sugg">${s.length?`<span class="lbl">Gehört zu:</span>`:""}${s.map((c,i)=>`<button class="sbtn ${i===0?"best":""}" data-act="move" data-id="${t.id}" data-cat="${c.id}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(catPath(c.id))}</button>`).join("")}
      <select class="movesel" data-move="${t.id}"><option value="">${s.length?"Andere …":"Einsortieren …"}</option>${catOptions(null)}</select></div>`;
  }
  if (opt.unpark) sug += `<div class="sugg"><button class="sbtn" data-act="unpark" data-id="${t.id}">↩ Zurückholen</button></div>`;
  if (opt.unwait) sug += `<div class="sugg"><button class="sbtn best" data-act="unwait" data-id="${t.id}">✓ Ist da – weiter geht's</button></div>`;
  return `<div class="task ${t.done?"done":""}" data-act="edit" data-id="${t.id}" id="t-${t.id}">
    <button class="chk ${t.prio?"p"+t.prio:""}" data-act="toggle" data-id="${t.id}" aria-label="Erledigt"></button>
    <div class="tb"><div class="tt">${esc(t.title)}</div>${meta?`<div class="meta">${meta}</div>`:""}${sug}</div></div>`;
}
function catOptions(selected, excludeIds=[]){
  const out=[];
  const walk=(pid,depth)=>kids(pid).forEach(c=>{ if(excludeIds.includes(c.id)) return; out.push(`<option value="${c.id}" ${c.id===selected?"selected":""}>${"   ".repeat(depth)}${depth?"└ ":""}${esc(c.name)}</option>`); walk(c.id,depth+1); });
  walk(null,0); return out.join("");
}

function renderSide(){
  const ib = inbox().length, td = todayList().length, ov = 0;
  const ni = (view,ic,name,ct,hot) => `<button class="ni ${UI.view===view?"on":""}" data-act="nav" data-view="${view}"><span class="ic">${ic}</span><span class="nm">${name}</span>${ct?`<span class="ct ${hot?"hot":""}">${ct}</span>`:""}</button>`;
  let tree = "";
  const walk=(pid,depth)=>kids(pid).forEach(c=>{
    const ch = kids(c.id).length, n = openIn(c.id).length;
    tree += `<button class="ni ${UI.view==="cat-"+c.id?"on":""}" style="padding-left:${10+depth*16}px" data-act="nav" data-view="cat-${c.id}">
      <span class="car ${ch?(c.collapsed?"closed":""):"none"}" data-act="collapse" data-id="${c.id}">▼</span>
      <span class="dot" style="background:${esc(c.color)}"></span><span class="nm">${esc(c.name)}</span>
      <span class="plus" data-act="newcat" data-parent="${c.id}" title="Unterkategorie">＋</span>${n?`<span class="ct">${n}</span>`:""}</button>`;
    if (!c.collapsed) walk(c.id,depth+1);
  });
  walk(null,0);
  const st = Sync.label();
  $("side").className = "side" + (UI.menu?" open":"");
  $("scrim").className = "scrim" + (UI.menu?" on":"");
  $("side").innerHTML = `<div class="brand"><i>✓</i>Kopfraum</div>
    <div class="nav">
      ${ni("inbox","📥","Eingang",ib,ib>0)}
      ${ni("today","☀️","Heute",td,false)}
      ${ni("overview","🧭","Überblick","",false)}
      ${ni("all","📋","Alle offenen",tasks().filter(live).length,false)}
      ${ni("later","💤","Später",parkedList().length,false)}
      ${ni("waiting","⏳","Warte auf",waitingList().length,false)}
      <h4>Kategorien <button data-act="newcat" title="Neue Kategorie">＋</button></h4>
      ${tree || `<div class="hint" style="margin:4px 10px">Noch keine Kategorien.</div>`}
      <h4>Rückblick</h4>
      ${ni("review","🌙","Heute geschafft",doneOn(dayOff(0)).length||"",false)}
      ${ni("done","✅","Erledigt",tasks().filter(t=>t.done).length,false)}
    </div>
    <div class="sidefoot"><div class="st" ${st.act?`data-act="${st.act}" style="cursor:pointer"`:""}><span class="sd ${st.cls}"></span><span>${esc(st.text)}</span></div>
      ${Sync.connected?`<button class="iconbtn" data-act="syncnow" title="Jetzt synchronisieren">⟳</button>`:""}
      <button class="iconbtn" data-act="settings" title="Einstellungen">⚙︎</button></div>`;
  $("banner").innerHTML = Sync.state==="auth" ? `<div class="note"><span>☁️ Google-Sync pausiert – Google gibt die Verbindung nur für eine Stunde frei.</span><button class="sbtn best" data-act="reauth">Fortsetzen</button></div>` : "";
  const tab = (view,ic,name,bd) => `<button class="${UI.view===view?"on":""}" data-act="nav" data-view="${view}"><b>${ic}</b>${name}${bd?`<span class="bd">${bd}</span>`:""}</button>`;
  $("tabs").innerHTML = tab("inbox","📥","Eingang",ib) + tab("today","☀️","Heute",td) + tab("overview","🧭","Überblick",ov||"") + `<button data-act="menu"><b>🗂</b>Kategorien</button>`;
}

function listBlock(list, opt={}){ if(!opt.all) list = list.filter(energyOk); return list.length ? `<div class="list">${list.map(t=>taskRow(t,opt)).join("")}</div>` : ""; }
function emptyBlock(icon, text){ return `<div class="empty"><b>${icon}</b>${text}</div>`; }

function filterBar(base){
  const hidden = base.filter(t=>!energyOk(t)).length;
  const anyTagged = tasks().some(t=>t.energy);
  if (!anyTagged && !CFG.energy) return "";
  return `<div class="fbar"><span class="lbl">Energie:</span>${Object.entries(EFILTER).map(([k,l])=>`<button class="sbtn ${CFG.energy===k?"best":""}" data-act="efilter" data-v="${k}">${l}</button>`).join("")}${hidden?`<span class="lbl">· ${hidden} ausgeblendet</span>`:""}</div>`;
}
function dayLeftMin(){ const [h,m]=(CFG.dayEnd||"22:00").split(":").map(Number); const e=new Date(); e.setHours(h,m||0,0,0); return Math.max(0,Math.round((e-new Date())/60000)); }
function timeCheck(list){
  const withEst = list.filter(t=>t.est); if(!withEst.length) return "";
  const sum = withEst.reduce((a,t)=>a+t.est,0), left = dayLeftMin(), missing = list.length-withEst.length;
  const tight = sum > left*0.75;
  const pct = left ? Math.min(100, Math.round(sum/left*100)) : 100;
  return `<div class="tcheck ${tight?"tight":""}"><div class="tc-top"><span>⏱ ≈ <b>${fmtMin(sum)}</b> geschätzt${missing?` <span class="muted">(+${missing} ohne Schätzung)</span>`:""}</span><span class="muted">bis ${esc(CFG.dayEnd)} noch ${fmtMin(left)}</span></div>
    <div class="tc-bar"><i style="width:${pct}%"></i></div>
    ${left===0?`<div class="tc-msg">Dein Tag ist eigentlich schon rum. Was noch offen ist, darf gern morgen dran sein. <button class="sbtn best" data-act="tomorrow">Auswählen</button></div>`:tight?`<div class="tc-msg">Das wird eng – völlig normal, Pläne sind immer optimistisch. Magst du etwas auf morgen schieben? <button class="sbtn best" data-act="tomorrow">Auswählen</button></div>`:""}</div>`;
}
function renderMain(){
  const v = UI.view; let title="", sub="", html="";
  if (v==="inbox"){
    const base = sortTasks(inbox()), l = base.filter(energyOk);
    title="Eingang"; sub = base.length ? `${base.length} ${base.length===1?"Gedanke wartet":"Gedanken warten"} aufs Einsortieren – kein Stress, wann du willst.` : "";
    html = filterBar(base) + (l.length ? `<div class="group">${listBlock(l,{inbox:true})}</div>` : emptyBlock("🌿", base.length?"Mit diesem Filter ist hier gerade nichts.":"Kopf ist leer. Alles einsortiert!"));
  }
  else if (v==="today"){
    const base = sortTasks(todayList()), l = base.filter(energyOk);
    title="Heute"; sub="Fällig, liegengeblieben oder mit hoher Priorität";
    const over=l.filter(isOver), rest=l.filter(t=>!isOver(t));
    html = filterBar(base);
    if (l.length) html += `<div class="fstart"><button class="btn pri" data-act="focus">🎯 Fokus starten</button><span class="muted">Eine Aufgabe, ein Timer, sonst nichts.</span></div>`;
    html += timeCheck(l);
    if (over.length) html += `<div class="group"><h3>🔁 Liegengeblieben – passiert jedem <span style="flex:1"></span><button class="sbtn best" data-act="replan">Neu planen</button></h3>${listBlock(over)}</div>`;
    if (rest.length) html += `<div class="group"><h3>Für heute</h3>${listBlock(rest)}</div>`;
    if (!l.length) html += emptyBlock("☀️", base.length?"Mit diesem Filter ist für heute nichts dabei.":"Nichts fällig heute. Gönn dir was – oder schau in den Überblick.");
  }
  else if (v==="all"){
    title="Alle offenen"; sub="Ohne Zurückgestelltes und „Warte auf“";
    const base = tasks().filter(live);
    const ib = sortTasks(base.filter(t=>!catById(t.catId)));
    html = filterBar(base);
    if (ib.length) html += `<div class="group"><h3>📥 Eingang</h3>${listBlock(ib)}</div>`;
    kids(null).forEach(r=>{ const g=sortTasks(openIn(r.id)).filter(energyOk); if(g.length) html+=`<div class="group"><h3><span class="dot" style="background:${esc(r.color)}"></span>${esc(r.name)}</h3>${listBlock(g,{subOnly:true,rootId:r.id})}</div>`; });
    if (!base.filter(energyOk).length) html += emptyBlock("🎉","Keine offenen Aufgaben.");
  }
  else if (v==="later"){
    title="Später"; sub="Zurückgestellt – taucht von selbst wieder auf. Aus den Augen, aber nicht vergessen.";
    const l = parkedList(), sn = l.filter(t=>!t.someday).sort((a,b)=>a.snooze<b.snooze?-1:1), sd = sortTasks(l.filter(t=>t.someday));
    const byDay = {}; sn.forEach(t=>(byDay[t.snooze]=byDay[t.snooze]||[]).push(t));
    Object.entries(byDay).forEach(([d,g])=>{ html += `<div class="group"><h3>Kommt zurück am ${fmtDate(d)}${d===dayOff(1)?" (morgen)":""}</h3>${listBlock(g,{all:true,unpark:true})}</div>`; });

  }
  else if (v==="waiting"){

      : emptyBlock("⏳","Du wartest gerade auf nichts. Trag in einer Aufgabe unter „Mehr“ ein, worauf du wartest.");
  }
  else if (v==="review"){ ({title, sub, html} = reviewView()); }
  else if (v==="done"){
    title="Erledigt";
    const l = sortTasks(tasks().filter(t=>t.done)).slice(0,200);
    sub = l.length ? "Schau, was du schon alles geschafft hast." : "";
    html = l.length ? `<div class="group">${listBlock(l,{all:true})}</div>` : emptyBlock("🌱","Hier landet alles, was du abhakst.");
  }
  else if (v.startsWith("cat-")){
    const c = catById(v.slice(4));
    if (!c){ UI.view="overview"; return renderMain(); }
    title = `<span class="dot" style="display:inline-block;background:${esc(c.color)};width:12px;height:12px;margin-right:8px;vertical-align:middle"></span>${esc(c.name)}`;
    const parent = catById(c.parentId);
    sub = parent ? `in ${esc(catPath(parent.id))}` : "";
    html = filterBar(openIn(c.id));
    const own = sortTasks(tasks().filter(t=>t.catId===c.id && live(t)));
    html += `<div class="group"><h3>Direkt in ${esc(c.name)} <span style="flex:1"></span><button class="sbtn" data-act="editcat" data-id="${c.id}">✎ Bearbeiten</button><button class="sbtn" data-act="newcat" data-parent="${c.id}">＋ Unterkategorie</button></h3>${own.filter(energyOk).length?listBlock(own,{showCat:false}):`<div class="hint" style="margin:4px">Keine Aufgaben direkt hier. Tipp: <code>#${esc(norm(c.name))}</code> beim Eintippen.</div>`}</div>`;
    const walk=(pid,depth)=>kids(pid).forEach(k=>{
      const l = sortTasks(tasks().filter(t=>t.catId===k.id && live(t)));
      html += `<div class="group" style="margin-left:${depth*14}px"><h3><span class="dot" style="background:${esc(k.color)}"></span><button data-act="nav" data-view="cat-${k.id}">${esc(catPath(k.id).split(" › ").slice(catPath(c.id).split(" › ").length).join(" › "))}</button><span>· ${openIn(k.id).length}</span></h3>${l.filter(energyOk).length?listBlock(l,{showCat:false}):`<div class="hint" style="margin:4px">leer</div>`}</div>`;
      walk(k.id,depth+1);
    });
    walk(c.id,0);
    const ids=new Set(descIds(c.id));
    const parkedHere = tasks().filter(t=>!t.done && ids.has(t.catId) && (t.waiting || isParked(t)));
    if (parkedHere.length) html += `<div class="hint" style="margin:14px 4px 0">Außerdem ${parkedHere.length} zurückgestellt oder wartend – siehe <button class="sbtn" data-act="nav" data-view="later">💤 Später</button> <button class="sbtn" data-act="nav" data-view="waiting">⏳ Warte auf</button></div>`;
    const dn = sortTasks(tasks().filter(t=>t.done && ids.has(t.catId)));
    if (dn.length){
      html += `<button class="showdone" data-act="showdone">${UI.showDone?"▾":"▸"} Erledigt (${dn.length})</button>`;
      if (UI.showDone) html += listBlock(dn.slice(0,100),{all:true});
    }
  }
  else { // overview
    title="Überblick"; sub = greeting();
    const open = tasks().filter(live);
    const over = open.filter(isOver).length, ib = inbox().length, td = todayList().length;
    const doneToday = doneOn(dayOff(0)).length;
    html = filterBar(open) + `<div class="stats">
      <button class="stat" data-act="nav" data-view="inbox"><div class="n">${ib}</div><div class="l">📥 im Eingang</div></button>
      <button class="stat" data-act="nav" data-view="today"><div class="n">${td}</div><div class="l">☀️ für heute</div></button>
      <button class="stat ${over?"over":""}" data-act="${over?"replan":"nav"}" data-view="today"><div class="n">${over}</div><div class="l">🔁 neu planen</div></button>
      <button class="stat" data-act="nav" data-view="review"><div class="n">${doneToday}</div><div class="l">✅ heute geschafft</div></button></div>`;
    if (new Date().getHours()>=17 && (doneToday || stepsOn(dayOff(0)).length)) html += `<div class="note" style="border-left-color:var(--ok)">🌙 Feierabend in Sicht? Schau dir an, was du heute geschafft hast. <button class="sbtn best" data-act="nav" data-view="review" style="margin-left:6px">Rückblick</button></div>`;
    if (ib>=5) html += `<div class="note">📥 Im Eingang liegen ${ib} Sachen. Ein paar Minuten Einsortieren hilft – ich schlage dir jeweils eine passende Kategorie vor. <button class="sbtn best" data-act="nav" data-view="inbox" style="margin-left:6px">Los geht's</button></div>`;
    html += `<div class="cards">`;
    kids(null).forEach(r=>{
      const l = sortTasks(openIn(r.id)).filter(energyOk), ovc = l.filter(isOver).length;
      const subs = kids(r.id).map(k=>`<button data-act="nav" data-view="cat-${k.id}">${esc(k.name)}<em>${openIn(k.id).length}</em></button>`).join("");
      html += `<div class="card" style="--c:${esc(r.color)}">
        <div class="hd" data-act="nav" data-view="cat-${r.id}"><b>${esc(r.name)}</b>${ovc?`<span class="ov">${ovc} neu planen</span>`:""}<span>${l.length} offen ›</span></div>
        ${subs?`<div class="subs">${subs}</div>`:""}
        <div class="mini">${l.slice(0,4).map(t=>taskRow(t,{subOnly:true,rootId:r.id, showCat: !!catById(t.catId)?.parentId})).join("") || `<div class="nothing">Alles erledigt ✨</div>`}</div>
        ${l.length>4?`<button class="showdone" style="margin:6px 0 0" data-act="nav" data-view="cat-${r.id}">+ ${l.length-4} weitere</button>`:""}
      </div>`;
    });
    html += `<button class="card" style="--c:var(--line);align-items:center;justify-content:center;color:var(--muted);min-height:120px;border-style:dashed" data-act="newcat">＋ Neue Kategorie</button></div>`;
    const stale = sortTasks(open.filter(t=>!t.due && catById(t.catId) && (t.updated||0) > 1e12 && now()-t.updated > 14*864e5)).slice(0,5);
    if (stale.length) html += `<div class="group"><h3>🕸 Droht unterzugehen – seit über 2 Wochen nicht angefasst</h3>${listBlock(stale)}</div>`;
  }
  $("title").innerHTML = title + (sub?`<span class="sub">${sub}</span>`:"");
  $("content").innerHTML = html;
}
const doneOn = d => tasks().filter(t=>t.done && t.doneAt && dstr(new Date(t.doneAt))===d);
const stepsOn = d => tasks().flatMap(t=>(t.steps||[]).filter(s=>s.done && s.doneAt && dstr(new Date(s.doneAt))===d).map(s=>({s,t})));
function reviewView(){
  const T = dayOff(0), dt = sortTasks(doneOn(T)), ds = stepsOn(T).filter(x=>!x.t.done || dstr(new Date(x.t.doneAt||0))!==T);
  const days = [...Array(7)].map((_,i)=>dayOff(i-6)).map(d=>({d, n:doneOn(d).length + stepsOn(d).length}));
  const max = Math.max(1,...days.map(x=>x.n));
  let html = `<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><div class="n">${dt.length}</div><div class="l">Aufgaben erledigt</div></div><div class="stat"><div class="n">${ds.length}</div><div class="l">Schritte geschafft</div></div></div>`;
  if (!dt.length && !ds.length) html += `<div class="note" style="border-left-color:var(--ok)">Heute noch keine Häkchen – und das ist okay. Ausruhen, Durchhalten und Dinge im Kopf sortieren zählen auch. Morgen ist ein neuer Tag. 🌱</div>`;
  else html += `<div class="note" style="border-left-color:var(--ok)">${dt.length+ds.length>=5?"Starker Tag!":"Gut gemacht."} Jedes Häkchen hier hast du dir verdient. 🌙</div>`;
  if (dt.length) html += `<div class="group"><h3>✅ Erledigt</h3>${listBlock(dt,{all:true})}</div>`;
  if (ds.length) html += `<div class="group"><h3>☑ Schritte</h3><div class="list">${ds.map(({s,t})=>`<div class="task" data-act="edit" data-id="${t.id}"><span class="chk" style="background:var(--ok);border-color:var(--ok)"></span><div class="tb"><div class="tt">${esc(s.title)}</div><div class="meta"><span class="chip">aus „${esc(t.title)}“</span></div></div></div>`).join("")}</div></div>`;
  html += `<div class="group"><h3>Die letzten 7 Tage</h3><div class="week">${days.map(x=>{ const d=new Date(x.d+"T12:00"); return `<div class="wd"><div class="wb"><i style="height:${Math.round(x.n/max*100)}%"></i></div><b>${x.n||""}</b><span>${x.d===T?"heute":["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]}</span></div>`; }).join("")}</div><div class="hint" style="margin:8px 4px">Kein Wettbewerb, keine Serie, die reißen kann – nur ein Blick zurück.</div></div>`;
  return {title:"Rückblick", sub:dateLong(), html};
}

/* Neu planen ohne Schuldgefühl */
function snapshot(ids){ const m={}; ids.forEach(id=>{ const t=S.tasks.find(x=>x.id===id); if(t) m[id]=JSON.stringify(t); }); return () => { const t0=now(); Object.entries(m).forEach(([id,j])=>{ const i=S.tasks.findIndex(x=>x.id===id); if(i>=0) S.tasks[i]={...JSON.parse(j),updated:t0}; }); commit(); }; }
function replan(){
  const l = sortTasks(tasks().filter(t=>live(t) && isOver(t)));
  if (!l.length){ toast("Nichts liegengeblieben 🌿"); return; }
  openModal(`<h2>🔁 Neu planen</h2>
    <p style="margin:0 0 14px;color:var(--muted)">${l.length} ${l.length===1?"Aufgabe ist":"Aufgaben sind"} liegengeblieben. Das passiert jedem – Pläne sind Schätzungen, keine Versprechen. Wie willst du weitermachen?</p>
    <div style="display:grid;gap:8px">
      <button class="stat" data-act="rp" data-k="spread"><div style="font-weight:600">🌊 Sanft verteilen</div><div class="l">Höchstens 3 pro Tag ab heute, Wichtiges zuerst</div></button>
      <button class="stat" data-act="rp" data-k="today"><div style="font-weight:600">☀️ Alles auf heute</div><div class="l">Wenn du heute Kapazität hast</div></button>
      <button class="stat" data-act="rp" data-k="nodate"><div style="font-weight:600">🗓 Datum entfernen</div><div class="l">Bleibt in der Kategorie, ohne Termindruck</div></button>
      <button class="stat" data-act="rp" data-k="some"><div style="font-weight:600">💤 Auf „Irgendwann“</div><div class="l">Aus den Augen, nicht vergessen</div></button>
    </div>
    <div class="acts"><span class="sp"></span><button class="btn" data-act="close">Abbrechen</button></div>`);
}
function doReplan(k){
  const l = sortTasks(tasks().filter(t=>live(t) && isOver(t)));
  const undo = snapshot(l.map(t=>t.id));
  if (k==="spread"){ const load={}; tasks().filter(t=>live(t)&&t.due&&t.due>=dayOff(0)).forEach(t=>load[t.due]=(load[t.due]||0)+1);
    l.forEach(t=>{ let i=0; while((load[dayOff(i)]||0)>=3) i++; t.due=dayOff(i); load[t.due]=(load[t.due]||0)+1; touch(t); }); }
  l.forEach(t=>{ if(k==="today") t.due=dayOff(0); if(k==="nodate") t.due=null; if(k==="some"){ t.someday=true; } touch(t); });
  closeModal(); commit();
  toast({spread:"Sanft verteilt 🌊", today:"Alles auf heute ☀️", nodate:"Termindruck raus 🗓", some:"Auf Irgendwann 💤"}[k], undo);
}
function pickTomorrow(){
  const l = sortTasks(todayList()).filter(energyOk);
  let sel = new Set();
  openModal(`<h2>Was darf auf morgen?</h2><p style="margin:0 0 12px;color:var(--muted);font-size:14px">Tipp an, was heute nicht mehr sein muss.</p>
    <div class="list" id="tm">${l.map(t=>`<div class="task" data-id="${t.id}"><span class="chk"></span><div class="tb"><div class="tt">${esc(t.title)}</div><div class="meta">${t.est?`<span class="chip">⏱ ${fmtMin(t.est)}</span>`:""}${t.prio?`<span class="chip p${t.prio}">⚑ ${PRIO[t.prio]}</span>`:""}</div></div></div>`).join("")}</div>
    <div class="acts"><span class="sp"></span><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" id="tm-go">Auf morgen</button></div>`);
  $("tm").onclick = e => { const r=e.target.closest(".task"); if(!r) return; e.stopPropagation(); const id=r.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); r.classList.toggle("done", sel.has(id)); };
  $("tm-go").onclick = () => { if(!sel.size){ closeModal(); return; } const undo=snapshot([...sel]); sel.forEach(id=>{ const t=S.tasks.find(x=>x.id===id); t.due=dayOff(1); touch(t); }); closeModal(); commit(); toast(`${sel.size} auf morgen verschoben`, undo); };
}
function greeting(){
  const h = new Date().getHours();
  const g = h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Noch wach?";
  return `${g}! Alles auf einen Blick.`;
}
function render(){ renderSide(); renderMain(); }

/* ============ Modals ============ */
function openModal(html){ $("modal").innerHTML = html; $("ovbg").classList.add("on"); const f=$("modal").querySelector("[autofocus]"); if(f && matchMedia("(min-width:861px)").matches) setTimeout(()=>f.focus(),30); }
function closeModal(){ $("ovbg").classList.remove("on"); $("modal").innerHTML=""; }

function editTask(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  let prio = t.prio||0, est = t.est||0, energy = t.energy||"";
  let steps = (t.steps||[]).map(s=>({...s}));
  const parked = !t.done && isParked(t);
  const segBtns = (arr,cur,key) => arr.map(([v,l])=>`<button type="button" data-${key}="${v}" class="${String(v)===String(cur)?"on":""}">${l}</button>`).join("");
  openModal(`<h2 style="display:flex;align-items:center;gap:10px"><span style="flex:1">Aufgabe</span>${t.done?"":`<button class="btn" id="f-focus" style="font-size:14px">🎯 Fokus</button>`}</h2>
    ${parked?`<div class="note" style="margin:0 0 14px;border-left-color:var(--accent);display:flex;align-items:center;gap:10px"><span style="flex:1">💤 ${t.someday?"Liegt auf „Irgendwann“":`Zurückgestellt bis ${fmtDate(t.snooze)}`}</span><button class="sbtn best" id="f-unpark">Zurückholen</button></div>`:""}
    <div class="fld"><label>Titel</label><input id="f-title" value="${esc(t.title)}" autofocus></div>
    <div class="fld"><label>Schritte</label><div id="f-steps" class="steps"></div>
      <div class="codebox" style="margin-top:6px"><input id="f-step" style="font-family:inherit;font-size:15px" placeholder="＋ Schritt hinzufügen" enterkeyhint="done"><button type="button" class="btn" style="white-space:nowrap" id="f-ai" title="Von Claude in kleine Schritte zerlegen lassen">🤖 Zerlegen</button></div></div>
    <div class="row2">
      <div class="fld"><label>Kategorie</label><select id="f-cat"><option value="">📥 Eingang</option>${catOptions(t.catId)}</select></div>
      <div class="fld"><label>Fällig</label><input type="date" id="f-due" value="${t.due||""}"></div>
    </div>
    <div class="fld"><label>Priorität</label><div class="seg" id="f-prio">${segBtns([[0,"keine"],[1,"⚑ niedrig"],[2,"⚑ mittel"],[3,"⚑ hoch"]],prio,"p")}</div></div>
    <details class="more" ${t.est||t.energy||t.waiting||t.notes?"open":""}><summary>Mehr: Dauer, Energie, Warten, Notizen</summary>
      <div class="fld"><label>Ungefähre Dauer <span class="opt">optional</span></label><div class="seg" id="f-est">${segBtns([[0,"–"],[5,"5′"],[15,"15′"],[30,"30′"],[60,"1 h"],[120,"2 h"]],est,"v")}</div></div>
      <div class="fld"><label>Was kostet es dich? <span class="opt">optional</span></label><div class="seg" id="f-en">${segBtns([["","–"],...Object.entries(ENERGY).map(([k,v])=>[k,`${v.ic} ${v.n}`])],energy,"v")}</div></div>
      <div class="fld"><label>⏳ Warte auf … <span class="opt">optional – solange ausgefüllt, zählt die Aufgabe nicht als offen</span></label><input id="f-wait" value="${esc(t.waiting||"")}" placeholder="z. B. Antwort von Max, Paket, Rückruf Arzt"></div>
      <div class="fld"><label>Notizen</label><textarea id="f-notes" placeholder="Details, Links, Gedanken …">${esc(t.notes)}</textarea></div>
    </details>
    ${t.done?"":`<div class="fld" style="margin-top:12px"><label>💤 Zurückstellen – taucht erst dann wieder auf</label><div class="seg" id="f-park"><button type="button" data-k="1">Morgen</button><button type="button" data-k="7">Nächste Woche</button><button type="button" data-k="date">Datum …</button><button type="button" data-k="some">Irgendwann</button></div><input type="date" id="f-pdate" style="display:none;margin-top:8px" min="${dayOff(1)}"></div>`}
    <div class="acts"><button class="btn dan" data-act="deltask" data-id="${id}">Löschen</button><span class="sp"></span><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" id="f-save">Speichern</button></div>`);
  const drawSteps = () => {
    $("f-steps").innerHTML = steps.map((s,i)=>`<div class="step ${s.done?"done":""}"><button type="button" class="chk" data-i="${i}" data-k="t"></button><span>${esc(s.title)}</span><button type="button" class="x" data-i="${i}" data-k="x" title="Entfernen">×</button></div>`).join("");
  };
  drawSteps();
  $("f-steps").onclick = e => { const b=e.target.closest("button"); if(!b) return; const i=+b.dataset.i; if(b.dataset.k==="t"){ steps[i].done=!steps[i].done; steps[i].doneAt=steps[i].done?now():null; } else steps.splice(i,1); drawSteps(); };
  $("f-step").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); const v=e.target.value.trim(); if(v){ steps.push({id:uid(),title:v,done:false}); e.target.value=""; drawSteps(); } } };
  const wireSeg = (id,fn) => $(id).onclick = e => { const b=e.target.closest("button"); if(!b) return; fn(b); [...$(id).children].forEach(x=>x.classList.toggle("on",x===b)); };
  wireSeg("f-prio", b=>prio=+b.dataset.p);
  wireSeg("f-est", b=>est=+b.dataset.v);
  wireSeg("f-en", b=>energy=b.dataset.v);
  let park = null;
  const collect = () => {
    const title = $("f-title").value.trim(); if(!title) return false;
    const pend = $("f-step").value.trim(); if (pend) steps.push({id:uid(),title:pend,done:false});
    const newCat = $("f-cat").value || null;
    if (newCat && newCat!==t.catId && !catById(t.catId)) learn(t,newCat);
    const w = $("f-wait").value.trim();
    if (w && !t.waiting) t.waitSince = now(); if (!w) t.waitSince = null;
    Object.assign(t,{title, notes:$("f-notes").value, catId:newCat, due:$("f-due").value||null, prio, steps, est:est||null, energy:energy||null, waiting:w||null});
    if (park){ Object.assign(t, park); }
    touch(t); return true;
  };
  const doSave = () => { if(!collect()) return; closeModal(); commit(); };
  $("f-save").onclick = doSave;
  $("f-title").onkeydown = e => { if(e.key==="Enter") doSave(); };
  $("f-ai").onclick = () => { if(!collect()) return; save(); render(); Sync.schedule(); copyPrompt(Bridge.steps(t)); };
  if ($("f-focus")) $("f-focus").onclick = () => { if(!collect()) return; closeModal(); commit(); Focus.open(t.id); };
  if ($("f-unpark")) $("f-unpark").onclick = () => { park = {snooze:null, someday:false}; if(!collect()) return; closeModal(); commit(); toast("Ist wieder da ✓"); };
  if ($("f-park")) $("f-park").onclick = e => {
    const b=e.target.closest("button"); if(!b) return; const k=b.dataset.k;
    if (k==="date"){ const d=$("f-pdate"); d.style.display="block"; d.focus(); try{ d.showPicker(); }catch(_){}
      d.onchange = () => { if(!d.value) return; park={snooze:d.value, someday:false}; if(!collect()) return; closeModal(); commit(); toast(`💤 Bis ${fmtDate(d.value)} zurückgestellt`, undoPark(t)); }; return; }
    park = k==="some" ? {someday:true, snooze:null} : {snooze:dayOff(+k), someday:false};
    if(!collect()) return; closeModal(); commit();
    toast(k==="some" ? "💤 Liegt jetzt auf „Irgendwann“" : `💤 Taucht ${k==="1"?"morgen":"nächste Woche"} wieder auf`, undoPark(t));
  };
}
const undoPark = t => () => { t.snooze=null; t.someday=false; touch(t); commit(); };

function editCat(id, parentId=null){
  const c = id ? catById(id) : null;
  let color = c ? c.color : (catById(parentId)?.color || COLORS[cats().filter(x=>!x.parentId).length % COLORS.length]);
  const excl = c ? descIds(c.id) : [];
  openModal(`<h2>${c?"Kategorie bearbeiten":(parentId?"Neue Unterkategorie":"Neue Kategorie")}</h2>
    <div class="fld"><label>Name</label><input id="c-name" value="${esc(c?.name||"")}" placeholder="z. B. Projekt Alpha" autofocus></div>

  const doSave = () => {

    if (c){ Object.assign(c,{name,color,parentId:pid,keywords:$("c-kw").value}); touch(c); }

      const sib = cats().filter(x=>x.parentId===pid);
      const nc = {id:uid(),name,color,parentId:pid,keywords:$("c-kw").value,order:(Math.max(0,...sib.map(x=>x.order||0))+1),collapsed:false,learn:{},updated:now()};

  };

/* ============ KI-Brücke zu Claude (Kopieren & Einfügen, kostenlos über dein Abo) ============ */
const dateLong = () => new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const Bridge = {
  catList(){ const out=[]; const walk=pid=>kids(pid).forEach(c=>{ out.push(`${c.id}: ${catPath(c.id)}`); walk(c.id); }); walk(null); return out.length ? out.join("\n") : "(noch keine)"; },
  taskLine(t){ const p=[`${t.id}: ${t.title}`]; const c=catById(t.catId); if(c) p.push(`[${catPath(c.id)}]`); if(t.due) p.push(`fällig ${t.due}`); if(t.prio) p.push(`prio ${t.prio}`); if(t.est) p.push(`~${t.est} min`); if(t.energy) p.push(`energie ${t.energy}`); return p.join(" "); },
  head(task){ return `Du hilfst mir bei meiner To-Do-App „Kopfraum“. Ich habe ADHS und bin etwas autistisch veranlagt: Bitte kurz, konkret und freundlich, ohne Druck.\nHeute ist ${dateLong()} (${dayOff(0)}).\n\nAUFGABE:\n${task}\n`; },
  fmt: `\nANTWORTFORMAT:\nSchreib zuerst 1–3 kurze Sätze für mich. Danach GENAU EINEN Codeblock mit der Sprache json in dieser Form:\n{"kopfraum":1,"ops":[ … ]}\n\nErlaubte ops:\n- {"op":"move","id":"<Aufgaben-ID>","cat":"<Kategorie-ID>"}  optional zusätzlich "due":"JJJJ-MM-TT" und "prio":0-3\n- {"op":"add","title":"…","cat":"<Kategorie-ID oder null = Eingang>"}  optional "due", "prio", "steps":["…"]\n- {"op":"steps","id":"<Aufgaben-ID>","steps":["…","…"]}\n- {"op":"newcat","id":"neu1","name":"…","parent":"<Kategorie-ID oder null>"}  nur wenn wirklich keine passt; danach "neu1" als cat benutzbar\nBei move und add zusätzlich optional: "est": geschätzte Minuten (Zahl), "energy": "leicht" | "fokus" | "sozial" | "reize".\nprio: 0 keine, 1 niedrig, 2 mittel, 3 hoch. Verwende nur IDs aus den Listen oben. Lass Felder weg, die sich nicht ändern sollen.`,
  sortInbox(){
    const l = inbox(); if(!l.length){ toast("Der Eingang ist leer 🌿"); return null; }
    return this.head("Sortiere alle Einträge aus meinem Eingang in passende Kategorien. Wenn ein Datum oder eine Dringlichkeit herauszulesen ist, setze due/prio. Formuliere Titel nicht um.")
      + `\nKATEGORIEN (ID: Pfad):\n${this.catList()}\n\nEINGANG (ID: Titel):\n${l.map(t=>`${t.id}: ${t.title}`).join("\n")}\n` + this.fmt;
  },
  dump(text){
    return this.head("Hier ist ein ungefilterter Gedanken-Dump von mir. Mach daraus einzelne, klare To-Dos (kurze Titel, mit Verb). Ordne jedes einer passenden Kategorie zu (oder null = Eingang, wenn unklar). Größere Vorhaben bekommen 3–6 kleine Schritte. Lass Gefühle und Nebensätze weg, die keine Aufgabe sind.")
      + `\nKATEGORIEN (ID: Pfad):\n${this.catList()}\n\nMEIN GEDANKEN-DUMP:\n"""\n${text}\n"""\n` + this.fmt;
  },
  steps(t){
    return this.head(`Zerlege diese Aufgabe in 3–7 kleine, konkrete Schritte. Jeder Schritt soll in höchstens 15–20 Minuten machbar sein und mit einem Verb beginnen. Der erste Schritt soll so leicht sein, dass ich sofort anfangen kann.`)
      + `\nDIE AUFGABE:\n${this.taskLine(t)}${t.notes?`\nNotizen: ${t.notes}`:""}${t.steps?.length?`\nSchon vorhandene Schritte: ${t.steps.map(s=>s.title).join(" | ")}`:""}\n` + this.fmt + `\nBenutze hier ein einziges {"op":"steps","id":"${t.id}","steps":[…]}.`;
  },
  focus(time, energy, mood){
    const l = sortTasks(tasks().filter(t=>live(t)&&energyOk(t))).slice(0,80);
    return this.head(`Hilf mir zu entscheiden, was ich JETZT mache. Ich habe ${time} Zeit und meine Energie ist ${energy}.${mood?` Außerdem: ${mood}`:""}\nSchlag mir 1 Hauptaufgabe und höchstens 2 Alternativen vor, jeweils mit einem Satz warum und dem allerersten Mini-Schritt. Keine Liste mit allem, kein Codeblock nötig.`)
      + `\nMEINE OFFENEN AUFGABEN:\n${l.map(t=>this.taskLine(t)).join("\n")}\n`;
  },
  parse(raw){
    let txt = raw.trim();
    const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (m) txt = m[1];
    else { const a=txt.indexOf("{"), b=txt.lastIndexOf("}"); if(a>=0&&b>a) txt=txt.slice(a,b+1); }
    const d = JSON.parse(txt);
    if (!d || !Array.isArray(d.ops)) throw new Error("Keine ops gefunden");
    return d.ops;
  },
  preview(ops){
    const tmp = {}; const out=[];
    const cname = id => tmp[id] ? tmp[id]+" (neu)" : (id && catById(id) ? catPath(id) : "Eingang");
    ops.forEach(o=>{
      const t = o.id && S.tasks.find(x=>x.id===o.id && !x.deleted);
      if (o.op==="newcat"){ tmp[o.id]=o.name; out.push(`🗂 Neue Kategorie „${o.name}“${o.parent?` in ${cname(o.parent)}`:""}`); }
      else if (o.op==="move" && t) out.push(`→ „${t.title}“ nach ${cname(o.cat)}${o.due?` · 📅 ${o.due}`:""}${o.prio?` · ⚑ ${PRIO[o.prio]}`:""}`);
      else if (o.op==="add" && o.title) out.push(`＋ „${o.title}“ → ${cname(o.cat)}${o.due?` · 📅 ${o.due}`:""}${o.steps?.length?` · ${o.steps.length} Schritte`:""}`);
      else if (o.op==="steps" && t && o.steps?.length) out.push(`☑ ${o.steps.length} Schritte für „${t.title}“`);
      else out.push(`⚠️ übersprungen: ${JSON.stringify(o).slice(0,60)}`);
    });
    return out;
  },
  apply(ops){
    const snap = JSON.stringify(S);
    const map = {}; let n=0;
    const cid = id => map[id] || (catById(id) ? id : null);
    const okDue = d => typeof d==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
    const okPrio = p => [0,1,2,3].includes(+p) ? +p : 0;
    const okEst = m => (+m>0 && +m<=600) ? Math.round(+m) : null;
    const mkSteps = arr => (arr||[]).filter(x=>typeof x==="string"&&x.trim()).map(x=>({id:uid(),title:x.trim(),done:false}));
    ops.filter(o=>o.op==="newcat" && o.name).forEach(o=>{
      const pid = cid(o.parent); const sib = cats().filter(x=>x.parentId===pid);
      const c = {id:uid(),name:String(o.name).slice(0,60),color:catById(pid)?.color||COLORS[cats().length%COLORS.length],parentId:pid,keywords:"",order:Math.max(0,...sib.map(x=>x.order||0))+1,collapsed:false,learn:{},updated:now()};
      S.cats.push(c); map[o.id]=c.id; n++;
    });
    ops.forEach(o=>{
      const t = o.id && S.tasks.find(x=>x.id===o.id && !x.deleted);
      if (o.op==="move" && t){ const c=cid(o.cat); if(c){ if(!catById(t.catId)) learn(t,c); t.catId=c; } if("due" in o) t.due=okDue(o.due); if("prio" in o) t.prio=okPrio(o.prio); if(okEst(o.est)) t.est=okEst(o.est); if(ENERGY[o.energy]) t.energy=o.energy; touch(t); n++; }
      else if (o.op==="add" && o.title){ S.tasks.push({id:uid(),title:String(o.title).slice(0,300),notes:"",catId:cid(o.cat),due:okDue(o.due),prio:okPrio(o.prio),est:okEst(o.est),energy:ENERGY[o.energy]?o.energy:null,steps:mkSteps(o.steps),done:false,created:now(),updated:now()}); n++; }
      else if (o.op==="steps" && t && o.steps?.length){ t.steps=[...(t.steps||[]),...mkSteps(o.steps)]; touch(t); n++; }
    });
    commit();
    toast(`${n} Änderungen übernommen ✓`, ()=>{ const old=JSON.parse(snap); const keep=new Set([...old.tasks.map(x=>x.id),...old.cats.map(x=>x.id)]);
      // Rückgängig: alten Stand wiederherstellen, neu angelegte Einträge löschen (mit Zeitstempel, damit der Sync es übernimmt)
      const t0=now(); S.tasks.filter(x=>!keep.has(x.id)).forEach(x=>{x.deleted=true;x.updated=t0;}); S.cats.filter(x=>!keep.has(x.id)).forEach(x=>{x.deleted=true;x.updated=t0;});
      old.tasks.forEach(o=>{ const i=S.tasks.findIndex(x=>x.id===o.id); if(i>=0) S.tasks[i]={...o,updated:t0}; });
      old.cats.forEach(o=>{ const i=S.cats.findIndex(x=>x.id===o.id); if(i>=0) S.cats[i]={...o,updated:t0}; });
      commit(); });
  }
};

const LS_FOCUS = "kopfraum_focus_v1";
const RING_C = 2*Math.PI*90;
const Focus = {
  st:null, tick:null, wake:null, done:false,
  task(){ return this.st && S.tasks.find(x=>x.id===this.st.id && !x.deleted); },
  pick(){
    const T = sortTasks(todayList().filter(energyOk));
    const rest = sortTasks(tasks().filter(t=>live(t) && energyOk(t) && !T.includes(t)));
    const l = [...T, ...rest].slice(0,7);

    openModal(`<h2>🎯 Woran möchtest du arbeiten?</h2>
      <p style="margin:0 0 12px;color:var(--muted);font-size:14px">Such dir eine aus – die erste ist mein Vorschlag.</p>
      <div class="list">${l.map((t,i)=>`<div class="task" data-act="focus-go" data-id="${t.id}"><span style="width:22px;text-align:center">${i===0?"⭐":""}</span><div class="tb"><div class="tt">${esc(t.title)}</div><div class="meta">${catById(t.catId)?`<span class="chip">${esc(catPath(t.catId))}</span>`:""}${dueChip(t)}${t.est?`<span class="chip">⏱ ${fmtMin(t.est)}</span>`:""}${t.energy?`<span class="chip">${ENERGY[t.energy].ic}</span>`:""}</div></div></div>`).join("")}</div>
      <div class="acts"><span class="sp"></span><button class="btn" data-act="close">Abbrechen</button></div>`);
  },
  open(id){
    const t = S.tasks.find(x=>x.id===id); if(!t) return;
    const min = t.est && t.est<=90 ? t.est : 25;
    this.st = {id, mode:"work", dur:min*60, left:min*60, end:null, running:false, notified:false};
    this.done=false; this.persist(); this.draw();
  },
  resume(){
    const s = lsGet(LS_FOCUS);
    if (s && S.tasks.find(x=>x.id===s.id && !x.done && !x.deleted)){ this.st=s; this.draw(); if(s.running){ this.loop(); this.lock(); } }
  },
  persist(){ if(this.st) lsSet(LS_FOCUS,this.st); },
  rem(){ const s=this.st; return s.running ? (s.end-now())/1000 : s.left; },
  start(){ const s=this.st; if(s.left<=0){ s.left=s.dur; s.notified=false; } s.end=now()+s.left*1000; s.running=true; this.persist(); this.loop(); this.lock(); this.drawCtl(); },
  pause(){ const s=this.st; s.left=Math.max(this.rem(),0); s.running=false; s.end=null; clearInterval(this.tick); this.persist(); this.release(); this.update(); this.drawCtl(); },
  setDur(min, mode){ const s=this.st; s.mode=mode||s.mode; s.dur=min*60; s.left=s.dur; s.end=null; s.running=false; s.notified=false; clearInterval(this.tick); this.persist(); this.draw(); },
  add(min){ const s=this.st; if(this.rem()<0){ s.left=min*60; s.dur=min*60; if(s.running) s.end=now()+min*60000; } else { if(s.running) s.end+=min*60000; else s.left+=min*60; s.dur+=min*60; } s.notified=false; this.persist(); this.draw(); if(!s.running) this.start(); },
  loop(){ clearInterval(this.tick); this.tick=setInterval(()=>this.update(),1000); this.update(); },
  async lock(){ try{ if(navigator.wakeLock && !this.wake) this.wake = await navigator.wakeLock.request("screen"); }catch(e){} },
  release(){ try{ this.wake?.release(); }catch(e){} this.wake=null; },
  close(){ clearInterval(this.tick); this.release(); this.st=null; try{ localStorage.removeItem(LS_FOCUS); }catch(e){} $("focus").classList.remove("on"); $("focus").innerHTML=""; document.title="Kopfraum"; render(); },
  update(){
    const s=this.st; if(!s || !$("f-ring")) return;
    const r=this.rem(), frac=Math.max(0,Math.min(1,r/s.dur));
    $("f-ring").style.strokeDashoffset = (RING_C*(1-frac)).toFixed(1);
    $("f-ring").style.opacity = frac>0.002 ? 1 : 0;
    const over = r<0, a=Math.abs(r);
    $("f-time").textContent = over ? `+${Math.ceil(a/60)} min` : a>=60 ? `${Math.ceil(a/60)} min` : `${Math.ceil(a)} s`;
    $("f-tlbl").textContent = over ? "drüber – alles okay" : s.running ? (s.mode==="pause"?"Pause":"noch") : (s.left<s.dur?"pausiert":"bereit");
    $("focus").classList.toggle("over", over);
    document.title = s.running ? `${over?"+":""}${$("f-time").textContent} · Kopfraum` : "Kopfraum";
    if (r<=0 && !s.notified){
      s.notified=true; this.persist();
      try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
      if (CFG.sound) softChime();
      $("f-end").innerHTML = s.mode==="pause"
        ? (this.task()?.done ? `<div class="f-msg">Pause vorbei 🌿</div><div class="f-row"><button class="btn pri" data-act="focus">Nächste Aufgabe wählen</button><button class="btn" data-act="f-close">Fokus beenden</button></div>`
          : `<div class="f-msg">Pause vorbei. Bereit für die nächste Runde?</div><div class="f-row"><button class="btn pri" data-act="f-dur" data-v="25" data-m="work">25 min arbeiten</button><button class="btn" data-act="f-dur" data-v="15" data-m="work">15 min</button></div>`)
        : `<div class="f-msg">Zeit ist um 🌿 Kurz aufstehen, Wasser trinken?</div><div class="f-row"><button class="btn" data-act="f-add" data-v="5">+5 min weiter</button><button class="btn pri" data-act="f-dur" data-v="5" data-m="pause">5 min Pause</button></div>`;
    }
  },
  drawCtl(){
    const s=this.st; if(!s || !$("f-ctl")) return;
    $("f-ctl").innerHTML = s.running
      ? `<button class="btn" data-act="f-pause">⏸ Pause</button><button class="btn" data-act="f-add" data-v="5">+5 min</button>`
      : `<button class="btn pri big" data-act="f-start">▶ ${s.left<s.dur&&s.left>0?"Weiter":"Start"}</button>`;
    $("f-durs").style.visibility = s.running ? "hidden" : "visible";
  },
  draw(){
    const s=this.st, t=this.task(); if(!s||!t){ this.close(); return; }
    const c = catById(t.catId), st = t.steps||[], cur = st.find(x=>!x.done), doneN = st.filter(x=>x.done).length;
    const durs = [5,15,25,45]; if (t.est && t.est<=90 && !durs.includes(t.est)) durs.push(t.est); durs.sort((a,b)=>a-b);
    let body;
    if (this.done){
      const next = sortTasks(todayList().filter(x=>energyOk(x) && x.id!==t.id))[0];
      body = `<div class="f-done"><div style="font-size:54px">🎉</div><h2>Geschafft!</h2><p>„${esc(t.title)}“ ist erledigt. Das zählt.</p>
        <div class="f-row">${next?`<button class="btn pri" data-act="f-next" data-id="${next.id}">Weiter mit: ${esc(next.title.length>34?next.title.slice(0,32)+"…":next.title)}</button>`:""}<button class="btn" data-act="f-dur" data-v="5" data-m="pause">5 min Pause</button><button class="btn" data-act="f-close">Fokus beenden</button></div></div>`;
    } else body = `
      <div class="f-cat">${c?`<span class="dot" style="background:${esc(c.color)}"></span>${esc(catPath(c.id))}`:"📥 Eingang"}${s.mode==="pause"?" · Pause":""}</div>
      <h1 class="f-title">${esc(t.title)}</h1>
      <div class="f-timer">
        <svg viewBox="0 0 200 200" class="f-svg"><circle cx="100" cy="100" r="90" class="f-bg"/><circle id="f-ring" cx="100" cy="100" r="90" class="f-fg ${s.mode==="pause"?"pz":""}" style="stroke-dasharray:${RING_C.toFixed(1)}"/></svg>
        <div class="f-center"><div id="f-tlbl" class="f-lbl"></div><div id="f-time" class="f-time"></div><div class="f-lbl">von ${fmtMin(Math.round(s.dur/60))}</div></div>
      </div>
      <div id="f-durs" class="f-durs">${durs.map(d=>`<button class="sbtn ${d*60===s.dur?"best":""}" data-act="f-dur" data-v="${d}">${d} min</button>`).join("")}</div>

          : st.length ? `<div class="f-now">Alle ${st.length} Schritte erledigt ✓</div>`
          : `<div class="f-lbl">Was ist der allererste Mini-Schritt?</div><div class="codebox" style="max-width:420px;margin:6px auto 0"><input id="f-first" placeholder="z. B. Datei öffnen" style="font-family:inherit"><button class="btn" data-act="f-addstep">＋</button></div>`}
      </div>
      <div class="f-row f-bottom"><button class="btn pri" data-act="f-taskdone">✓ Aufgabe erledigt</button><button class="btn" data-act="f-later">💤 Später</button><button class="btn" data-act="f-close">Beenden</button></div>`;

    $("focus").classList.add("on");
    if (!this.done){ this.drawCtl(); this.update(); if (s.notified && this.rem()<=0){ s.notified=false; this.update(); } }
    const fi=$("f-first"); if(fi) fi.onkeydown=e=>{ if(e.key==="Enter") Focus.addStep(); };
  },
  addStep(){ const t=this.task(), v=$("f-first")?.value.trim(); if(!t||!v) return; t.steps=[...(t.steps||[]),{id:uid(),title:v,done:false}]; touch(t); save(); Sync.schedule(); this.draw(); },
  stepDone(sid){ const t=this.task(); const x=t?.steps?.find(z=>z.id===sid); if(!x) return; x.done=true; x.doneAt=now(); touch(t); save(); Sync.schedule(); toast(CFG.calm?"Schritt erledigt":"Schritt geschafft ✓"); this.draw(); },
  taskDone(){ const t=this.task(); if(!t) return; t.done=true; t.doneAt=now(); touch(t); save(); Sync.schedule(); this.pause(); this.done=true; this.draw(); },
};
function softChime(){
  try { const ac = new (window.AudioContext||window.webkitAudioContext)(); [523.25,659.25].forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,ac.currentTime+i*.25); g.gain.linearRampToValueAtTime(.08,ac.currentTime+i*.25+.05); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.25+1.2); o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.25); o.stop(ac.currentTime+i*.25+1.3); }); } catch(e){}
}

let toastTimer;
function toast(text, undo){
  if (CFG.calm) text = String(text).replace(/[\p{Extended_Pictographic}\u2600-\u27BF]\uFE0F?/gu,"").replace(/\s+/g," ").trim();
  const el=$("toast"); el.innerHTML = esc(text) + (undo?` <button id="undo">Rückgängig</button>`:"");
  el.classList.add("on"); clearTimeout(toastTimer);
  if (undo) $("undo").onclick = () => { undo(); el.classList.remove("on"); };
  toastTimer = setTimeout(()=>el.classList.remove("on"), undo?5000:2500);
}
